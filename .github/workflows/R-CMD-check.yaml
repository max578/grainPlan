# Slim single-job R-CMD-check for grainPlan.
# One OS, R release, to keep Actions minutes bounded on a dev repo. decideR is a
# GitHub-only dependency (DESCRIPTION `Remotes: max578/decideR`), installed by
# setup-r-dependencies. Expand to a 3-OS x 3-R matrix only when targeting CRAN /
# rOpenSci. Workflow derived from r-lib/actions examples.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
